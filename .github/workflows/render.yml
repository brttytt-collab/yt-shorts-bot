name: Render and Upload YouTube Short

on:
  repository_dispatch:
    types: [generate_short]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fontconfig
          fc-cache -f
          fc-list | grep -i amiri | head -3
          pip install edge-tts

      - name: Render video
        env:
          PAYLOAD: ${{ github.event.client_payload.script_data }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python render.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/
